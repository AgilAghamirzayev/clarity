[project]
name = "csi-worker"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "temporalio>=1.11,<2", "psycopg[binary]>=3.2,<4", "boto3>=1.38,<2", "aiokafka>=0.12,<1",
 "httpx>=0.28,<1", "pydantic>=2.11,<3", "faster-whisper>=1.1,<2", "numpy>=2,<3",
 "scikit-learn>=1.6,<2", "soundfile>=0.13,<1", "scipy>=1.15,<2", "speechbrain==1.0.3",
 "torch==2.6.0", "torchaudio==2.6.0", "huggingface-hub>=0.28,<1", "gliner==0.2.21", "transformers>=4.49,<5"
]
[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
