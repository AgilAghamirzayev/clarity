server:
  port: ${API_PORT:8086}
  address: ${API_BIND:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: strict
spring:
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5546/csi}
    username: csi_app
    password: ${DB_APP_PASSWORD}
  flyway:
    user: csi_owner
    password: ${DB_OWNER_PASSWORD}
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
