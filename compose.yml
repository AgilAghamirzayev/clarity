name: csi
services:
  postgres:
    image: csi-postgres:18-pgvector
    build:
      context: .
      dockerfile: infra/Postgres.Dockerfile
    environment:
      POSTGRES_USER: csi_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Run scripts/setup-local.py}
      POSTGRES_DB: csi
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Run scripts/setup-local.py}
    ports: ["127.0.0.1:5546:5432"]
    volumes: ["db:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csi_owner -d csi"]
      interval: 3s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["127.0.0.1:9100:9000", "127.0.0.1:9101:9001"]
    volumes: ["audio:/data"]
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports: ["127.0.0.1:19092:19092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:19092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["events:/var/lib/kafka/data"]
  temporal-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
    volumes: ["temporal-db:/var/lib/postgresql/data"]
  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on: [temporal-db]
    ports: ["127.0.0.1:17233:7233"]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_SEEDS: temporal-db
  temporal-ui:
    image: temporalio/ui:2.53.3
    depends_on: [temporal]
    ports: ["127.0.0.1:18233:8080"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
volumes:
  db:
  audio:
  events:
  temporal-db:
